version: '3.9'
services:
  mysql:
    image: mysql:8.0
    container_name: smartprep-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: smartprep
    ports:
      - "3306:3306"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7
    container_name: smartprep-redis
    ports:
      - "6379:6379"

  neo4j:
    image: neo4j:5-community
    container_name: smartprep-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data

  backend:
    image: maven:3.9.6-eclipse-temurin-17
    container_name: smartprep-backend
    working_dir: /app
    command: bash -c "mvn -q spring-boot:run"
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis

  frontend:
    image: node:20
    container_name: smartprep-frontend
    working_dir: /app
    command: bash -c "npm install && npm run dev -- --host"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  neo4j-data:
